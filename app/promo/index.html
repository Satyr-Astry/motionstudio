<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>MotionStudio · 宣传片</title>
<style>
    html, body { margin: 0; height: 100%; background: #0e0f11; color: #e6e8ec;
        font: 13px/1.6 "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; }
    #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    canvas { max-width: 100vw; max-height: 100vh; display: block; background: #141518; }
    #tip { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
        padding: 6px 12px; border-radius: 4px; background: rgba(33,35,40,.92);
        border: 1px solid #33363d; color: #9aa1ac; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="tip">自动播放 · 点画面暂停/继续 · R 重播（这是预览页；视频文件由 promo.js 的 record() 生成）</div>
<script type="module">
import { draw, preload, duration, size } from './promo.js';

const cv = document.getElementById('cv');
const g = cv.getContext('2d');
const dpr = Math.min(2, window.devicePixelRatio || 1);
cv.width = Math.round(size.w * dpr);
cv.height = Math.round(size.h * dpr);
cv.style.width = size.w + 'px';
cv.style.height = size.h + 'px';

await preload();

let t = 0;
let playing = true;
let last = performance.now();

function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (playing) {
        t += dt;
        if (t > duration) t = 0;
    }
    draw(g, t, cv.width, cv.height);
    requestAnimationFrame(frame);
}

cv.addEventListener('click', () => { playing = !playing; });
window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') { t = 0; playing = true; }
});
requestAnimationFrame(frame);
</script>
</body>
</html>
