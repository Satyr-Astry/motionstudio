<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" />
    <title>MotionStudio</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/shell.css" />
    <link rel="stylesheet" href="./styles/panels.css" />
    <!-- 项目库浮层的样式：原先内联在 shell/project-io.mjs 的 MODAL_CSS 里，现独立成文件 -->
    <link rel="stylesheet" href="./styles/projects.css" />
    <!-- 纹理属性组（editors/prop-textures.mjs）：只放 .ptx-*，行/标签/输入框复用 panels.css -->
    <link rel="stylesheet" href="./styles/textures.css" />
    <link rel="stylesheet" href="./styles/board.css" />
    <link rel="stylesheet" href="./styles/palette.css" />
    <!-- 导出对话框（第 32 批）：只放进度条，其余样式内联在 editors/export-dialog.mjs 里 -->
    <link rel="stylesheet" href="./styles/export.css" />
    <!-- 图标层放最后：只用「宿主类 + 装配类」双类覆盖尺寸，收口在图标自己的文件里 -->
    <link rel="stylesheet" href="./styles/icons.css" />
</head>
<body>
    <header id="topbar"></header>
    <main id="ws-host"></main>
    <footer id="statusbar"></footer>
    <!--
        浏览器桥：没有 window.motionAPI（纯网页部署）时，用下载 + 文件选择框
        补齐 saveProject/loadProject/importFile/exportFrames/exportSheet/saveBinary。
        必须排在 app.mjs 之前：同文档多个 module 按顺序求值，装好桥再启动。
        桌面壳里检测到 window.motionAPI 就什么都不做。
    -->
    <script type="module" src="./shell/bridge-web.mjs"></script>
    <script type="module" src="./shell/app.mjs"></script>
</body>
</html>
